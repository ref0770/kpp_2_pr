<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>My Electron App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Мій Electron додаток</h1>
    <p>Версія 2.0.0</p>
    <button id="actionButton">Натисни мене</button>
    <div id="output"></div>
  </div>
  <script>
    document.getElementById('actionButton').addEventListener('click', () => {
      const output = document.getElementById('output');
      output.textContent = 'Кнопка натиснута! ' + new Date().toLocaleTimeString();
      output.style.color = '#2196f3';
    });
  </script>
</body>
</html>
